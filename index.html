<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Copper Overdrive" />
    <title>Copper Overdrive · Mesmotronic</title>
  </head>
  <body>
    <div id="loader">
      <div class="crt">
        <div class="logo">MESMOTRONIC</div>
        <div class="sub">COPPER OVERDRIVE</div>
        <div id="bar"><div></div></div>
        <div id="status">INITIALISING</div>
        <div id="start">
          <span class="blink">&gt;&gt;&gt;</span>
          <span class="kbd">CLICK OR PRESS SPACE TO START</span><span class="touch">TAP TO START</span>
          <span class="blink">&lt;&lt;&lt;</span>
        </div>
        <div class="small">HEADPHONES OR BIG SPEAKERS RECOMMENDED</div>
        <div class="small warn">WARNING: CONTAINS FLASHING LIGHTS AND STROBE EFFECTS</div>
      </div>
    </div>
    <div id="hint">
      <span class="kbd">SPACE: PAUSE &nbsp; LEFT/RIGHT: PARTS &nbsp; F: FULLSCREEN</span>
      <span class="touch">TAP: PAUSE &nbsp; SWIPE LEFT/RIGHT: PARTS &nbsp; SWIPE UP/DOWN: FULLSCREEN</span>
    </div>
    <div id="osd"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mesmoscene" />
    <meta name="color-scheme" content="dark" />
    <title>Welcome to the Mesmoscene</title>
    <meta name="description" content="A love letter to the 90s Atari ST &amp; Amiga demoscene from Mesmotronic. Built with three.js, WebGPU and TSL." />

    <!-- Open Graph; image URLs must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mesmotronic" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://labs.mesmotronic.com/three-mesmoscene/" />
    <meta property="og:title" content="Welcome to the Mesmoscene" />
    <meta property="og:description" content="A love letter to the 90s Atari ST &amp; Amiga demoscene from Mesmotronic. Built with three.js, WebGPU and TSL." />
    <meta property="og:image" content="https://labs.mesmotronic.com/three-mesmoscene/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Raymarched chrome metaballs hovering over a rippling rainbow dot landscape" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mesmotronic" />
    <meta name="twitter:title" content="Welcome to the Mesmoscene" />
    <meta name="twitter:description" content="A love letter to the 90s Atari ST &amp; Amiga demoscene from Mesmotronic. Built with three.js, WebGPU and TSL." />
    <meta name="twitter:image" content="https://labs.mesmotronic.com/three-mesmoscene/og-image.jpg" />
    <meta name="twitter:image:alt" content="Raymarched chrome metaballs hovering over a rippling rainbow dot landscape" />
    <style>
      /* critical styles: black from the first paint, UI text hidden until the app's CSS takes over */
      html,
      body {
        margin: 0;
        background: #000;
      }
      #hint,
      #osd {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="splash" role="button" aria-label="Mesmotronic. Loading."></canvas>
    <div id="hint">
      <span class="kbd">SPACE: PAUSE &nbsp; LEFT/RIGHT: PARTS &nbsp; F: FULLSCREEN</span>
      <span class="touch">TAP: PAUSE &nbsp; SWIPE LEFT/RIGHT: PARTS &nbsp; SWIPE UP/DOWN: FULLSCREEN</span>
    </div>
    <div id="osd"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

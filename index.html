<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mesmoscene" />
    <meta name="color-scheme" content="dark" />
    <title>Welcome to the Mesmoscene</title>
    <style>
      /* critical styles: black from the first paint, UI text hidden until the app's CSS takes over */
      html,
      body {
        margin: 0;
        background: #000;
      }
      #hint,
      #osd {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="splash" role="button" aria-label="Mesmotronic. Loading."></canvas>
    <div id="hint">
      <span class="kbd">SPACE: PAUSE &nbsp; LEFT/RIGHT: PARTS &nbsp; F: FULLSCREEN</span>
      <span class="touch">TAP: PAUSE &nbsp; SWIPE LEFT/RIGHT: PARTS &nbsp; SWIPE UP/DOWN: FULLSCREEN</span>
    </div>
    <div id="osd"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

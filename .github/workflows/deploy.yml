name: Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one deploy at a time; a newer push replaces any queued run
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish dist to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"

          git rm -rq --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/dist/." .
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
